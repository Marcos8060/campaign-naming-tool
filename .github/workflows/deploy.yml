name: Deploy

# Runs after the "CI" workflow (.github/workflows/ci.yml) finishes on main —
# deliberately NOT triggered directly by push. This means a deploy only
# happens if tests, lint, and the frontend build all passed first. If CI
# fails, this workflow is skipped entirely, so broken code never reaches
# production automatically.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    # Only proceed if the CI run this was triggered by actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/campaign-naming-tool
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
