name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Only the migration-check step below actually needs Postgres — the
    # pytest suite runs against a fully mocked asyncpg pool (see
    # backend/tests/conftest.py) and never opens a real connection.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campaign_intelligence
          POSTGRES_USER: campaign_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campaign_user -d campaign_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint — correctness (blocking)
        run: ruff check src tests --select F

      - name: Lint — style/imports (report only)
        continue-on-error: true
        run: ruff check src tests

      - name: Type check (report only)
        continue-on-error: true
        run: mypy src

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://campaign_user:ci_test_password@localhost:5432/campaign_intelligence
        run: python -c "import asyncio; from src.db.session import init_db; asyncio.run(init_db())"

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run type-check

      - name: Lint (no-console blocks, hardcoded-hex warns)
        run: npm run lint

      - run: npm run test -- --ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

  security:
    name: Security scanning (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        continue-on-error: true
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: npm audit (frontend deps)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (backend deps)
        continue-on-error: true
        working-directory: backend
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt
